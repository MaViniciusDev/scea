<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AEUCSAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>
<div class="left-panel">
    <img src="../img/UCSALlogo.png" alt="Logo UCSAL">
    <h2>Seja bem vindo ao AEUCSAL!</h2>
    <p>O portal de reservas de espaços acadêmicos da UCSAL.</p>
</div>
<div class="right-panel">
    <div class="login-card">
        <h2>Login</h2>
        <input type="email" placeholder="insira seu e-mail institucional">
        <button onclick="fazerLogin()">Login</button>
        <div class="register">
            <p>Ainda não tem uma conta? <a href="registration.html">Cadastre-se aqui!</a></p>
        </div>
    </div>
</div>
<script src="../js/login.js"></script>
</body>

</html>
