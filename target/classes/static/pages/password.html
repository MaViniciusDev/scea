<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Senha - AEUCSAL</title>
    <link rel="stylesheet" href="../css/login.css" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>
<div class="left-panel">
    <img src="../img/UCSALlogo.png" alt="Logo UCSAL" />
    <h2 id="nomeUsuario">Bem-vindo!</h2>
    <p>O portal de reservas de espaços acadêmicos da UCSAL.</p>
</div>
<div class="right-panel">
    <div class="login-card">
        <h2>Digite sua senha</h2>
        <input type="password" placeholder="Insira sua senha" />
        <div class="register">
            <p><a href="#" style="color: #e6007e">Esqueceu sua senha?</a></p>
        </div>
        <button onclick="confirmarLogin()">Login</button>
    </div>
</div>
<script src="../js/password.js"></script>
</body>
</html>
