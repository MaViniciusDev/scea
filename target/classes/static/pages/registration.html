<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - AEUCSAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
<div class="left-panel">
    <img src="../img/UCSALlogo.png" alt="Logo UCSAL">
    <h2>Bem-vindo ao AEUCSAL!</h2>
    <p>Cadastre-se para acessar o sistema de reservas da UCSAL.</p>
</div>

<div class="right-panel">
    <div class="login-card">
        <h2>Cadastro</h2>
        <form id="registerForm">
            <input type="text" name="firstName" placeholder="Nome" required>
            <input type="text" name="lastName" placeholder="Sobrenome" required>
            <input type="email" name="email" placeholder="E-mail institucional" required>
            <input type="password" name="password" placeholder="Senha" required>
            <input type="password" name="confirmPassword" placeholder="Repita sua senha" required>
            <span id="passwordError" style="color: #d32f2f; font-size: 0.9em; display: none;">As senhas não coincidem.</span>
            <button type="submit">Cadastrar</button>
        </form>
        <div class="register">
            <p>Já tem uma conta? <a href="login.html">Faça login aqui!</a></p>
        </div>
        <div id="mensagemCadastro" class="mensagem-cadastro" style="display: none;"></div>
    </div>
</div>

<div id="loader" class="loader-overlay" style="display: none;">
    <div class="spinner"></div>
</div>

<script src="../js/registration.js"></script>
</body>
</html>
